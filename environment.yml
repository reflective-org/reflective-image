channels:
  - conda-forge

dependencies:
  - jupyterhub-singleuser

  # Everyone wants to use nbgitpuller for everything, so let's do that
  - nbgitpuller
  # Code server is a VS Code like editor for the browser
  - code-server>=4.0
  # Jupyter-vscode-proxy is a proxy for the code server
  - jupyter-vscode-proxy
  # Jupyter-server-proxy is a proxy for the jupyter server
  - jupyter-server-proxy
  - cdo
  - nco
  # Install packages from pip
  - pip
  - pip:
    # --- JupyterLab 4.6 / @jupyter/ydoc v4 stack -------------------------
    # These four are one unit: bump them together, never singly. JupyterLab
    # 4.6 ships @jupyter/ydoc v4 as a federated singleton, while
    # jupyter-collaboration 4.x caps jupyter-collaboration-ui and
    # jupyter-docprovider at <3, whose prebuilt extensions are compiled
    # against ydoc v2/v3. The mismatch stops @jupyter/collaboration-extension
    # and @jupyter/docprovider-extension from loading, which takes out the RTC
    # document provider and loses notebook edits. Unpinned, the 2026-07-30
    # build landed in exactly that state; the 2026-08-06 build drifted back
    # out of it by luck when jupyter-collaboration 5.0.0 was released.
    # https://github.com/jupyter-ai-contrib/jupyter-server-documents/issues/265
    - jupyterlab>=4.6,<4.7
    - notebook>=7.6,<7.7
    - jupyter-collaboration>=5.0.3,<6
    - jupyter-server-documents>=0.3.3,<0.4

    - globus-sdk
    - pyopenssl>=24
    - s3fs
    - fsspec
    - gcsfs        # gcsfs pins fsspec exactly; must upgrade together
    - boto3
    - botocore
    - xarray==2026.7.0
    - zarr==3.2.1
    - icechunk==2.1.1
    # Compatible with icechunk>=2.0.6,<3 and zarr>=3.1,<4.
    - arraylake==1.2.0
    - issue-creds
    - jupyterlab-branding-extension==1.0.36
    - reflective-data-catalog
