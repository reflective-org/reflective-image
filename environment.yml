channels:
  - conda-forge

dependencies:
  - jupyterhub-singleuser

  # Everyone wants to use nbgitpuller for everything, so let's do that
  - nbgitpuller
  # Code server is a VS Code like editor for the browser
  - code-server>=4.0
  # Jupyter-vscode-proxy is a proxy for the code server
  - jupyter-vscode-proxy
  # Jupyter-server-proxy is a proxy for the jupyter server
  - jupyter-server-proxy
  - cdo
  - nco
  # Install packages from pip
  - pip
  - pip:
    # Jupyter-ai is a package for AI-powered notebooks
    # Installed via pip to avoid langchain/typer version conflicts with conda
    - jupyter-ai[all]
    - globus-sdk
    - pyopenssl>=24
    - s3fs
    - fsspec
    - gcsfs        # gcsfs pins fsspec exactly; must upgrade together
    - boto3
    - botocore
    - notebook     # resolve against the jupyterlab jupyter-ai pulls in
    - xarray==2026.7.0
    - zarr==3.2.1
    - icechunk==2.1.1
    - issue-creds
